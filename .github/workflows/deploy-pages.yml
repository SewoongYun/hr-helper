# main 브랜치에 올리면 지금 쓰는 버전의 site 폴더를 GitHub Pages로 자동 배포합니다.
# 새 버전(7차_개발 등)을 만들면 아래 SITE_DIR 만 바꾸면 됩니다.
# 저장소 Settings > Pages > Source 를 "GitHub Actions"로 설정해야 동작합니다.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE_DIR: "11차_개발/site"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 배포 전 점검: index.html 이 부르는 파일이 모두 있는지, JavaScript 문법이 맞는지 확인한다
      - name: Check site files
        run: |
          set -e
          cd "$SITE_DIR"
          test -f index.html
          for f in $(grep -oE '(src|href)="[^"#:]+\.(js|css)' index.html | sed -E 's/^(src|href)="//'); do
            test -f "$f" || { echo "없는 파일: $f"; exit 1; }
          done
          for f in *.js; do node --check "$f"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
      - id: deployment
        uses: actions/deploy-pages@v4
