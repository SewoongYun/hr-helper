# main 브랜치에 올리면 지금 쓰는 버전의 site 폴더를 GitHub Pages로 자동 배포합니다.
# 새 버전(3차_개발 등)을 만들면 아래 SITE_DIR 만 바꾸면 됩니다.
# 저장소 Settings > Pages > Source 를 "GitHub Actions"로 설정해야 동작합니다.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE_DIR: "2차_개발/site"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
      - id: deployment
        uses: actions/deploy-pages@v4
